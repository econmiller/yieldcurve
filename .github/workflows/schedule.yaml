name: Update Treasury Graph

# Run every day at 6:00 AM UTC
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows you to run it manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      # Setup R
      - uses: r-lib/actions/setup-r@v2
      
      # Install required packages
      - name: Install Packages
        run: |
          Rscript -e 'install.packages(c("dplyr", "ggplot2", "plotly", "htmlwidgets", "fredr"))'
          
      # Run your script
      - name: Run Script
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: Rscript update_graph.R
        
      # Commit the new HTML file back to the repository
      - name: Commit results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add treasury_yields_interactive.html
          git commit -m "Auto-update graph" || echo "No changes to commit"
          git push origin main
